<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Atomic Ideation — Research Canvas</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Caveat:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
<style>
/* ===== Atomic Ideation — Research Canvas =====
   Warm off-white base, hand-drawn feel, three radically different atom types.
*/

:root {
  /* Surface tones */
  --bg-deep: #F2EEE6;
  --bg: #FAF8F4;
  --bg-elev: #FFFFFF;
  --bg-tint: #F6F2EA;
  --paper: #FBF8F2;

  /* Ink */
  --ink: #1A1A1A;
  --ink-2: #3D3935;
  --ink-3: #6B6760;
  --ink-4: #9A958C;
  --ink-5: #C7C2B8;
  --line: #E5DFD3;
  --line-2: #EFEAE0;

  /* Accent */
  --amber: oklch(72% 0.13 65);
  --amber-soft: oklch(94% 0.04 65);
  --amber-ink: oklch(40% 0.12 60);

  /* Reactions */
  --support: oklch(64% 0.14 145);
  --challenge: oklch(62% 0.18 25);
  --refine: oklch(60% 0.13 240);
  --question: oklch(75% 0.13 85);
  --cite: oklch(56% 0.16 305);

  /* User colors (each contributor) */
  --u-rose:    oklch(82% 0.08 20);
  --u-amber:   oklch(86% 0.09 75);
  --u-citron:  oklch(88% 0.10 110);
  --u-mint:    oklch(85% 0.07 160);
  --u-sky:     oklch(85% 0.07 230);
  --u-iris:    oklch(82% 0.08 285);
  --u-clay:    oklch(80% 0.05 50);

  /* Shadows */
  --sh-1: 0 1px 2px rgba(60,50,30,.06), 0 1px 1px rgba(60,50,30,.04);
  --sh-2: 0 2px 8px rgba(60,50,30,.08), 0 1px 3px rgba(60,50,30,.05);
  --sh-3: 0 8px 24px rgba(60,50,30,.10), 0 2px 6px rgba(60,50,30,.06);
  --sh-paper: 0 1px 0 rgba(255,255,255,.6) inset, 0 1px 2px rgba(60,50,30,.08), 0 4px 12px rgba(60,50,30,.06);

  --r-1: 4px;
  --r-2: 8px;
  --r-3: 14px;
  --r-4: 20px;

  /* Type */
  --f-sans: 'Inter', system-ui, sans-serif;
  --f-hand: 'Caveat', 'Bradley Hand', cursive;
  --f-mono: 'JetBrains Mono', ui-monospace, monospace;
  --f-serif: 'Newsreader', Georgia, serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--f-sans);
  color: var(--ink);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: 'ss01', 'cv11';
  overflow: hidden;
  height: 100vh;
}

#root { height: 100vh; width: 100vw; overflow: hidden; }

button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ===== Paper Texture Background ===== */
.paper-bg {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 20% 30%, rgba(180,160,120,.04) 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(140,120,100,.03) 0%, transparent 50%),
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 23px,
      rgba(180,160,120,.025) 24px
    ),
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 23px,
      rgba(180,160,120,.02) 24px
    );
}

/* ===== Top Nav (persistent breadcrumb) ===== */
.topnav {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 56px;
  display: flex;
  align-items: center;
  padding: 0 20px;
  z-index: 50;
  background: rgba(250, 248, 244, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--line);
}

.topnav-brand {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--f-serif);
  font-size: 18px;
  font-weight: 500;
  letter-spacing: -0.01em;
}

.brand-mark {
  width: 22px; height: 22px;
  position: relative;
  display: inline-block;
}
.brand-mark::before, .brand-mark::after {
  content: ""; position: absolute; border-radius: 50%;
}
.brand-mark::before {
  width: 14px; height: 14px;
  background: var(--ink);
  top: 0; left: 0;
}
.brand-mark::after {
  width: 10px; height: 10px;
  border: 1.5px dashed var(--ink-3);
  bottom: 0; right: 0;
  background: var(--bg-elev);
}

.crumbs {
  display: flex; align-items: center; gap: 6px;
  margin-left: 24px;
  font-size: 13px;
  color: var(--ink-3);
  flex: 1;
}
.crumb {
  padding: 4px 8px; border-radius: 6px;
  cursor: pointer;
  transition: background 120ms;
}
.crumb:hover { background: var(--bg-tint); color: var(--ink); }
.crumb.active { color: var(--ink); font-weight: 500; }
.crumb-sep { color: var(--ink-5); }

.topnav-right {
  display: flex; align-items: center; gap: 14px;
}

.topnav-search {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-tint);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  color: var(--ink-3);
  width: 240px;
  cursor: pointer;
  transition: border-color 120ms;
}
.topnav-search:hover { border-color: var(--ink-5); }
.topnav-search kbd {
  margin-left: auto;
  font-family: var(--f-mono);
  font-size: 10px;
  background: var(--bg-elev);
  padding: 2px 5px;
  border-radius: 3px;
  border: 1px solid var(--line);
}

.icon-btn {
  width: 32px; height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px;
  color: var(--ink-3);
  position: relative;
}
.icon-btn:hover { background: var(--bg-tint); color: var(--ink); }
.icon-btn .badge {
  position: absolute;
  top: 4px; right: 4px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--challenge);
  border: 1.5px solid var(--bg);
}

.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--ink-2);
  border: 1.5px solid var(--bg);
  box-shadow: 0 0 0 1.5px currentColor;
}

/* ===== Reaction colors ===== */
.r-support { color: var(--support); }
.r-challenge { color: var(--challenge); }
.r-refine { color: var(--refine); }
.r-question { color: var(--question); }
.r-cite { color: var(--cite); }

.r-bg-support { background: color-mix(in oklch, var(--support) 14%, white); }
.r-bg-challenge { background: color-mix(in oklch, var(--challenge) 14%, white); }
.r-bg-refine { background: color-mix(in oklch, var(--refine) 14%, white); }
.r-bg-question { background: color-mix(in oklch, var(--question) 16%, white); }
.r-bg-cite { background: color-mix(in oklch, var(--cite) 14%, white); }

/* ===== Atom — Human (Sticky note) ===== */
.atom {
  position: absolute;
  user-select: none;
  cursor: pointer;
  transform-origin: center;
  transition: transform 200ms cubic-bezier(.2,.7,.3,1.1), box-shadow 160ms, opacity 200ms;
}
.atom:hover { z-index: 5; }

.atom-human {
  padding: 12px 14px 14px;
  border-radius: 4px 4px 4px 14px;
  box-shadow: var(--sh-paper);
  font-family: var(--f-hand);
  font-size: 19px;
  line-height: 1.18;
  color: var(--ink);
  letter-spacing: 0.01em;
  border: 1px solid rgba(0,0,0,0.04);
  position: relative;
}
.atom-human::after {
  /* tape */
  content: "";
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 28px; height: 12px;
  background: rgba(255,255,255,.45);
  border: 1px solid rgba(0,0,0,.04);
  pointer-events: none;
  display: none;
}
.atom-human:hover { transform: translate(-50%, -50%) rotate(var(--r, 0deg)) scale(1.04); box-shadow: var(--sh-3); }
.atom-human.has-tape::after { display: block; }

.atom-human .meta {
  margin-top: 8px;
  display: flex; align-items: center; gap: 6px;
  font-family: var(--f-sans);
  font-size: 10px;
  color: var(--ink-3);
  letter-spacing: 0.02em;
}
.atom-human .meta .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: currentColor;
  flex-shrink: 0;
}

/* ===== Atom — Literature (Dark flat card) ===== */
.atom-lit {
  background: #2A2724;
  color: #EBE6DA;
  border-radius: 3px;
  font-family: var(--f-sans);
  font-size: 12px;
  line-height: 1.4;
  box-shadow: var(--sh-2);
  overflow: hidden;
  border: 1px solid #1A1815;
}
.atom-lit:hover { transform: translate(-50%, -50%) scale(1.04); box-shadow: var(--sh-3); }

.atom-lit .lit-meta {
  background: #1F1D1A;
  padding: 5px 10px;
  display: flex; align-items: center; gap: 8px;
  font-family: var(--f-mono);
  font-size: 9px;
  color: #9A958C;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  border-bottom: 1px solid #383532;
}
.atom-lit .lit-meta .lit-icon {
  width: 10px; height: 10px;
  display: inline-block;
  border: 1.5px solid currentColor;
  border-bottom: 4px double currentColor;
  flex-shrink: 0;
}
.atom-lit .lit-body { padding: 9px 10px 11px; font-size: 12px; line-height: 1.42;}
.atom-lit .lit-cite {
  font-family: var(--f-mono);
  font-size: 9px;
  color: #8A857C;
  margin-top: 6px;
}

/* ===== Atom — AI (Dashed, ghostly) ===== */
.atom-ai {
  background: rgba(255,255,255,.5);
  border: 1.5px dashed var(--ink-4);
  border-radius: 14px;
  padding: 10px 12px;
  font-family: var(--f-sans);
  font-size: 12px;
  line-height: 1.45;
  color: var(--ink-2);
  backdrop-filter: blur(2px);
  position: relative;
}
.atom-ai:hover { transform: translate(-50%, -50%) scale(1.04); border-color: var(--ink-3); background: rgba(255,255,255,.85); }
.atom-ai .ai-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--f-mono);
  font-size: 9px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
}
.atom-ai .ai-tag::before {
  content: ""; width: 8px; height: 8px;
  border-radius: 50%;
  background: repeating-conic-gradient(var(--ink-3) 0 25%, transparent 0 50%);
  opacity: 0.6;
}

/* atom selected */
.atom.selected .atom-human,
.atom.selected .atom-lit,
.atom.selected .atom-ai {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}

/* atom highlight (from summary click) */
.atom.highlight {
  animation: atomPulse 1.6s ease-out;
}
@keyframes atomPulse {
  0% { box-shadow: 0 0 0 0 oklch(72% 0.13 65 / 0.5); }
  60% { box-shadow: 0 0 0 18px oklch(72% 0.13 65 / 0); }
  100% { box-shadow: 0 0 0 0 oklch(72% 0.13 65 / 0); }
}

/* ===== Subtopic cluster halo ===== */
.cluster-halo {
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
  border: 1.5px dashed rgba(180,160,120,0.35);
  background: radial-gradient(circle, rgba(255,253,247,0.45) 0%, rgba(255,253,247,0) 70%);
}
.cluster-label {
  position: absolute;
  font-family: var(--f-serif);
  font-size: 13px;
  font-style: italic;
  color: var(--ink-3);
  pointer-events: none;
  text-align: center;
  white-space: nowrap;
  letter-spacing: 0.01em;
}

/* ===== Reaction edges (SVG) ===== */
.edge-support { stroke: var(--support); stroke-width: 1.5; fill: none; }
.edge-challenge { stroke: var(--challenge); stroke-width: 1.5; fill: none; stroke-dasharray: 3 2; }
.edge-refine { stroke: var(--refine); stroke-width: 1.5; fill: none; }
.edge-question { stroke: var(--question); stroke-width: 1.5; fill: none; stroke-dasharray: 6 2 1 2; }
.edge-cite { stroke: var(--cite); stroke-width: 1.5; fill: none; }
.edge-weak { stroke: var(--ink-5); stroke-width: 1; fill: none; stroke-dasharray: 2 4; opacity: 0.6;}

/* ===== Pan/zoom canvas ===== */
.canvas-host {
  position: absolute;
  top: 56px; left: 0; right: 0; bottom: 0;
  overflow: hidden;
  cursor: grab;
}
.canvas-host.grabbing { cursor: grabbing; }
.canvas-stage {
  position: absolute;
  transform-origin: 0 0;
  width: 4000px; height: 3000px;
}

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid var(--line);
  background: var(--bg-elev);
  color: var(--ink);
  transition: all 120ms;
}
.btn:hover { border-color: var(--ink-4); transform: translateY(-1px); box-shadow: var(--sh-1); }
.btn-primary {
  background: var(--ink);
  color: var(--bg);
  border-color: var(--ink);
}
.btn-primary:hover { background: var(--ink-2); border-color: var(--ink-2); }
.btn-amber {
  background: var(--amber);
  color: white;
  border-color: var(--amber);
}
.btn-amber:hover { filter: brightness(1.05); }
.btn-ghost {
  background: transparent;
  border-color: transparent;
  color: var(--ink-3);
}
.btn-ghost:hover { background: var(--bg-tint); color: var(--ink); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }

/* Chip */
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 11px;
  background: var(--bg-tint);
  border: 1px solid var(--line);
  color: var(--ink-2);
}
.chip .swatch { width: 9px; height: 9px; border-radius: 50%; }

/* Cards */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--sh-1);
}

/* Scrollbar */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
::-webkit-scrollbar-thumb:hover { background: var(--ink-5); border: 2px solid transparent; background-clip: padding-box; }

/* Tweaks panel overrides */
.tw-panel { font-family: var(--f-sans) !important; }

/* ===== Modal ===== */
.modal-back {
  position: fixed; inset: 0;
  background: rgba(45, 40, 30, 0.45);
  backdrop-filter: blur(6px);
  z-index: 100;
  display: flex; align-items: center; justify-content: center;
  padding: 40px;
}
.modal {
  background: var(--bg);
  border-radius: 16px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.25);
  max-width: 720px; width: 100%;
  max-height: 88vh;
  overflow: auto;
  border: 1px solid var(--line);
}

/* Right drawer */
.drawer {
  position: fixed;
  top: 56px; right: 0; bottom: 0;
  width: 380px;
  background: var(--bg-elev);
  border-left: 1px solid var(--line);
  z-index: 40;
  overflow-y: auto;
  box-shadow: -8px 0 30px rgba(60,50,30,0.06);
}

/* ===== Onboarding overlay ===== */
.onboard-back {
  position: fixed; inset: 0;
  background: rgba(45, 40, 30, 0.55);
  backdrop-filter: blur(8px);
  z-index: 200;
  display: flex; align-items: center; justify-content: center;
}
.onboard-card {
  background: var(--bg);
  border-radius: 20px;
  width: 540px;
  padding: 36px 36px 28px;
  box-shadow: 0 30px 80px rgba(0,0,0,0.3);
  border: 1px solid var(--line);
  position: relative;
}

/* tooltip pointer for onboarding spotlights */
.spotlight {
  position: absolute;
  background: var(--ink);
  color: var(--bg);
  padding: 12px 14px;
  border-radius: 12px;
  max-width: 280px;
  font-size: 13px;
  line-height: 1.45;
  box-shadow: 0 8px 30px rgba(0,0,0,0.3);
  z-index: 201;
}
.spotlight::after {
  content: "";
  position: absolute;
  width: 10px; height: 10px;
  background: inherit;
  transform: rotate(45deg);
}
.spotlight.pos-bottom::after { top: -5px; left: 24px; }
.spotlight.pos-top::after { bottom: -5px; left: 24px; }
.spotlight.pos-left::after { right: -5px; top: 18px; }
.spotlight.pos-right::after { left: -5px; top: 18px; }

/* utility */
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.gap-2 { gap: 8px; }
.gap-3 { gap: 12px; }
.gap-4 { gap: 16px; }
.gap-6 { gap: 24px; }
.muted { color: var(--ink-3); }
.tiny { font-size: 11px; }
.mono { font-family: var(--f-mono); }
.serif { font-family: var(--f-serif); }
.hand { font-family: var(--f-hand); }
.italic { font-style: italic; }

/* SVG dotted icon for "AI" */
.ai-orb {
  width: 14px; height: 14px;
  border-radius: 50%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,.6), transparent 50%),
    conic-gradient(var(--ink-3) 0 25%, transparent 0 50%, var(--ink-3) 0 75%, transparent 0 100%);
  display: inline-block;
}

/* progress bar */
.progress {
  width: 100%; height: 4px;
  background: var(--line);
  border-radius: 2px;
  overflow: hidden;
}
.progress > span {
  display: block; height: 100%;
  background: var(--amber);
  transition: width 240ms ease;
}

/* Maturity meter (rings) */
.maturity {
  display: inline-flex; align-items: center; gap: 4px;
}
.maturity .ring {
  width: 10px; height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--ink-4);
}
.maturity .ring.full { background: var(--amber); border-color: var(--amber); }
.maturity .ring.half { background: linear-gradient(90deg, var(--amber) 50%, transparent 50%); }

/* Filter toolbar */
.toolbar {
  position: absolute;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  padding: 6px;
  border-radius: 12px;
  border: 1px solid var(--line);
  box-shadow: var(--sh-1);
  z-index: 30;
}
.toolbar .seg {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--ink-3);
  cursor: pointer;
  transition: all 120ms;
}
.toolbar .seg:hover { background: var(--bg-tint); color: var(--ink); }
.toolbar .seg.active { background: var(--ink); color: var(--bg); }
.toolbar .seg.muted-tone { opacity: 0.4; }
.toolbar .sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }

/* Minimap */
.minimap {
  position: absolute;
  bottom: 20px; right: 20px;
  width: 200px; height: 130px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--sh-2);
  overflow: hidden;
  z-index: 30;
}
.minimap-viewport {
  position: absolute;
  border: 1.5px solid var(--ink);
  background: rgba(255,200,80,0.15);
  border-radius: 3px;
  pointer-events: none;
}

/* zoom controls */
.zoom-ctl {
  position: absolute;
  bottom: 20px; left: 20px;
  display: flex;
  flex-direction: column;
  background: rgba(255,255,255,0.9);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 10px;
  box-shadow: var(--sh-1);
  overflow: hidden;
  z-index: 30;
}
.zoom-ctl button {
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--f-mono);
  font-size: 14px;
  color: var(--ink-2);
}
.zoom-ctl button:hover { background: var(--bg-tint); }
.zoom-ctl .div { height: 1px; background: var(--line); }

/* input area */
.input-dock {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  width: min(640px, 70vw);
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 10px;
  box-shadow: var(--sh-3);
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 8px;
}
.input-dock input {
  flex: 1;
  border: none;
  background: transparent;
  outline: none;
  font-family: var(--f-sans);
  font-size: 14px;
  color: var(--ink);
  padding: 8px 6px;
}
.input-dock input::placeholder { color: var(--ink-4); }

/* level transitions */
.level-fade-enter { opacity: 0; transform: scale(0.96); }
.level-fade-enter-active { opacity: 1; transform: scale(1); transition: all 320ms cubic-bezier(.2,.7,.3,1); }

/* user dot color helpers */
.dot-rose { color: var(--u-rose); }
.dot-amber { color: var(--u-amber); }
.dot-citron { color: var(--u-citron); }

// ---- Avatar ----

function LitAtom({ atom, selected, onClick, onContext, dimmed }) {

// ---- Generic atom dispatch ----
function AtomNode({ atom, users, selected, highlighted, onClick, onContext, hideAi, hideHuman, hideLit, colorByUser }) {
  if (atom.kind === 'human' && hideHuman) return null;
  if (atom.kind === 'lit' && hideLit) return null;
  if (atom.kind === 'ai' && hideAi) return null;
  const user = users.find(u => u.id === atom.authorId) || users[0];
  const dimmed = atom.edge && false; // edges are styled separately
  const cls = highlighted ? 'highlight' : '';

  if (atom.kind === 'human') {
    const u = colorByUser ? user : { ...user, bg: 'var(--paper)', colorVar: 'var(--ink-4)' };
    return <div className={cls}><HumanAtom atom={atom} user={u} selected={selected} onClick={onClick} onContext={onContext} /></div>;

  return null;
}
window.AtomNode = AtomNode;

// ---- Reaction edge SVG renderer ----
// edges between atoms by id, drawn as SVG paths; atom positions come in by id.
function ReactionEdges({ atoms, reactions, hideKinds = {}, width, height }) {
  const byId = useMemo(() => Object.fromEntries(atoms.map(a => [a.id, a])), [atoms]);
  const paths = reactions.filter(r => !hideKinds[r.kind] && byId[r.from] && byId[r.to]).map(r => {
    const a = byId[r.from];
    const b = byId[r.to];
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const mx = (a.x + b.x) / 2 + (-dy * 0.1);
    const my = (a.y + b.y) / 2 + (dx * 0.1);
    let d;
    if (r.kind === 'challenge') {
      // zigzag between the two
      const steps = 7;
      const pts = [];
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const px = a.x + dx * t;
        const py = a.y + dy * t;
        const off = (i % 2 === 0 ? -1 : 1) * 4;
        pts.push([px + (-dy / Math.hypot(dx,dy)) * off, py + (dx / Math.hypot(dx,dy)) * off]);
      }
      d = pts.map((p, i) => (i === 0 ? `M ${p[0]} ${p[1]}` : `L ${p[0]} ${p[1]}`)).join(' ');
    } else {
      d = `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
    }
    return { d, kind: r.kind, id: `${r.from}-${r.to}` };
  });
  return (
    <svg style={{ position: 'absolute', inset: 0, width: width || '100%', height: height || '100%', pointerEvents: 'none', zIndex: 1 }}>
      <defs>
        <marker id="arrow-refine" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--refine)" />
        </marker>
      </defs>
      {paths.map(p => (
        <path
          key={p.id}
          d={p.d}
          className={`edge-${p.kind}`}
          markerEnd={p.kind === 'refine' ? 'url(#arrow-refine)' : undefined}
        />
      ))}
    </svg>
  );
}
window.ReactionEdges = ReactionEdges;

// ---- Maturity meter ----
function Maturity({ value }) {
  const cells = 5;

    <span className="maturity" title={`Maturity ${Math.round(value*100)}%`}>

      <span className="mono tiny muted" style={{ marginLeft: 6 }}>{Math.round(value*100)}%</span>

  );
}

function ColorDot({ user, size = 10 }) {

// ---- Reaction context menu ----
function ReactionMenu({ atom, position, onPick, onClose }) {

  useEffect(() => {
    const h = () => onClose && onClose();
    window.addEventListener('click', h);
    return () => window.removeEventListener('click', h);
  }, [onClose]);
  return (
    <div
      className="card"
      style={{ position: 'fixed', left: position.x, top: position.y, zIndex: 200, padding: 6, minWidth: 180, boxShadow: 'var(--sh-3)' }}
      onClick={(e) => e.stopPropagation()}
    >
      <div className="tiny muted" style={{ padding: '6px 10px 4px' }}>React to this atom</div>
      {items.map(it => (
        <button
          key={it.key}
          className="row gap-2"
          style={{ width: '100%', padding: '8px 10px', borderRadius: 6, justifyContent: 'flex-start' }}
          onMouseEnter={(e) => e.currentTarget.style.background = 'var(--bg-tint)'}

          <span style={{ fontSize: 13 }}>{it.label}</span>
        </button>
      ))}

}

            </p>
            <div className="row gap-2" style={{ marginTop: 10, flexWrap: 'wrap' }}>
              <span className="chip"><span className="swatch" style={{ background: 'var(--u-amber)' }}/>metacognition</span>
              <span className="chip"><span className="swatch" style={{ background: 'var(--u-amber)' }}/>scaffolding granularity</span>
              <span className="chip"><span className="swatch" style={{ background: 'var(--u-amber)' }}/>complex problem decomposition</span>
            </div>
          </div>
        </div>
      ),
    },
    {
      title: 'Reactions, not deletions',
      body: (
        <div>
          <p style={{ fontSize: 14, lineHeight: 1.55, color: 'var(--ink-2)', margin: '8px 0 16px' }}>
            Atoms are never erased. They get connected: <strong>Support, Challenge, Refine, Question, Cite.</strong> Disagreement becomes structure, not noise.
          </p>
          <div className="row gap-3" style={{ flexWrap: 'wrap' }}>
            {[
              { k: 'support', label: 'Support', d: 'M0 8 H40' },
              { k: 'challenge', label: 'Challenge', d: 'M0 8 L4 4 L8 12 L12 4 L16 12 L20 4 L24 12 L28 4 L32 12 L36 4 L40 8' },
              { k: 'refine', label: 'Refine', d: 'M0 8 H36' },
              { k: 'question', label: 'Question', d: 'M0 8 H40' },
              { k: 'cite', label: 'Cite', d: 'M0 8 H40' },
            ].map(it => (
              <div key={it.k} className="row gap-2 tiny">
                <svg width="40" height="16" viewBox="0 0 40 16">
                  <path d={it.d} className={`edge-${it.k}`} markerEnd={it.k === 'refine' ? 'url(#arr)' : undefined}/>
                  <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--refine)" /></marker></defs>
                </svg>
                <span className="muted">{it.label}</span>
              </div>
            ))}
          </div>
        </div>
      ),
    },
  ];
  const cur = steps[step];
  return (
    <div className="onboard-back">
      <div className="onboard-card">
        <div className="row" style={{ marginBottom: 14 }}>
          <span className="mono tiny muted">{String(step+1).padStart(2,'0')} / {String(steps.length).padStart(2,'0')}</span>
          <button className="icon-btn" style={{ marginLeft: 'auto' }} onClick={onClose}><Icon name="x" size={14}/></button>
        </div>
        <h2 className="serif" style={{ margin: '0 0 4px', fontSize: 28, fontWeight: 500, letterSpacing: '-0.02em' }}>{cur.title}</h2>
        <div>{cur.body}</div>
        <div className="row" style={{ marginTop: 24 }}>
          <div className="row gap-2">
            {steps.map((_, i) => (
              <span key={i} style={{ width: 22, height: 3, borderRadius: 2, background: i <= step ? 'var(--ink)' : 'var(--line)' }} />
            ))}
          </div>
          <div className="row gap-2" style={{ marginLeft: 'auto' }}>
            {step > 0 && <button className="btn btn-ghost" onClick={() => setStep(s=>s-1)}>Back</button>}
            {step < steps.length - 1
              ? <button className="btn btn-primary" onClick={() => setStep(s=>s+1)}>Next <Icon name="arrow-right" size={13} /></button>
              : <button className="btn btn-primary" onClick={onClose}>Enter the lobby <Icon name="arrow-right" size={13} /></button>}
          </div>
        </div>
      </div>
    </div>
  );
}

function Sample({ type }) {

    <div style={{ width: 160 }}>
      <div className="atom-human" style={{ position: 'relative', background: 'oklch(95% 0.07 75)', transform: 'rotate(-1.5deg)' }}>
        Worth noticing what learners do when they're stuck before stepping in.
        <div className="meta"><span className="dot" style={{ color: 'var(--u-amber)' }}/>Ravi · 2d</div>

  if (type === 'lit') return (

        <div className="lit-meta"><span className="lit-icon"/>Literature</div>
        <div className="lit-body">Productive failure deepens conceptual learning.<div className="lit-cite">Kapur, 2008</div></div>

  if (type === 'ai') return (

}

function Stat({ label, value }) {

function BalanceSlider() {

  <script type="text/babel" data-presets="react">
// ===== screen-domain.jsx =====
var { useState, useEffect, useRef, useMemo, useCallback, Fragment } = React;
// ===== Domain Canvas — unified Topic + Subtopic experience (Levels 2 & 3 merged) =====
// One pan/zoom workspace. Topic regions hold subtopic accordion cards.
// Click a subtopic → it expands inline, revealing rich body + AtomNode visualization.
// Floater atoms drift in negative space within a topic, and between topics.
// Right-edge collapsible AI Summary rail. Bottom dock for input.

function DomainCanvas({
  domain, topics, subtopics, atoms, reactions, users, summary, insights, bridges,
  floaters, clusterSuggestions,
  filters, onFilterChange,
  onOpenAtomization, onOpenProposal, onOpenInsight,
}) {
  const hostRef = useRef(null);
  const [view, setView] = useState({ x: 0, y: 60, k: 0.62 });
  const [drag, setDrag] = useState(null);
  const [expanded, setExpanded] = useState(null); // subtopic id
  const [highlight, setHighlight] = useState(null); // atom id
  const [aiRailOpen, setAiRailOpen] = useState(true);
  const [reactionsState, setReactions] = useState(reactions);
  const [atomsState, setAtomsState] = useState(atoms);
  const [floatersState, setFloatersState] = useState(floaters || []);
  const [crystallized, setCrystallized] = useState({}); // suggestionId -> true once user accepts
  const [pulse, setPulse] = useState([]); // freshly added atom ids that should pulse

  // dragging an atom (only when expanded)
  const [atomDrag, setAtomDrag] = useState(null);

  const subById = useMemo(() => Object.fromEntries(subtopics.map(s => [s.id, s])), [subtopics]);
  const topicById = useMemo(() => Object.fromEntries(topics.map(t => [t.id, t])), [topics]);

  // pan
  const onMouseDown = (e) => {
    if (e.button !== 0) return;
    if (e.target.closest('.subtopic-card') || e.target.closest('.canvas-control') || e.target.closest('.atom-host')) return;
    setDrag({ sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y });
  };
  const onMouseMove = (e) => {
    if (atomDrag) {
      const dx = (e.clientX - atomDrag.sx) / view.k;
      const dy = (e.clientY - atomDrag.sy) / view.k;
      setAtomsState(prev => prev.map(a => a.id === atomDrag.id ? { ...a, x: atomDrag.ox + dx, y: atomDrag.oy + dy } : a));
      return;
    }
    if (!drag) return;
    setView(v => ({ ...v, x: drag.vx + (e.clientX - drag.sx), y: drag.vy + (e.clientY - drag.sy) }));
  };
  const onMouseUp = () => { setDrag(null); setAtomDrag(null); };

  const onWheel = (e) => {
    e.preventDefault();
    const host = hostRef.current.getBoundingClientRect();
    const mx = e.clientX - host.left;
    const my = e.clientY - host.top;
    const factor = e.deltaY > 0 ? 0.92 : 1.08;
    setView(v => {
      const nk = Math.max(0.25, Math.min(1.4, v.k * factor));
      const nx = mx - (mx - v.x) * (nk / v.k);
      const ny = my - (my - v.y) * (nk / v.k);
      return { x: nx, y: ny, k: nk };
    });
  };

  const zoomBtn = (delta) => {
    const host = hostRef.current.getBoundingClientRect();
    const mx = host.width / 2, my = host.height / 2;
    setView(v => {
      const nk = Math.max(0.25, Math.min(1.4, v.k + delta));
      const nx = mx - (mx - v.x) * (nk / v.k);
      const ny = my - (my - v.y) * (nk / v.k);
      return { x: nx, y: ny, k: nk };
    });
  };

  const fitToScreen = () => setView({ x: 0, y: 60, k: 0.62 });

  // expanding a subtopic → fly camera to it
  const expandSubtopic = (s) => {
    setExpanded(s.id);
    if (!hostRef.current) return;
    const hostRect = hostRef.current.getBoundingClientRect();

    // Compute the expanded card's center in CANVAS COORDS using the same math
    // SubtopicCard uses for X/Y when expanded:
    //   X_expanded = layout.x - (EXP_W - layout.w) / 2
    //   Y_expanded = layout.y - 40
    //   center = (X + EXP_W/2, Y + EXP_H/2) = (layout.x + layout.w/2, layout.y - 40 + EXP_H/2)
    const lay = subtopicLayouts[s.id];
    if (!lay) return;
    const cardCenterX = lay.x + lay.w / 2;
    const cardCenterY = lay.y - 40 + EXP_H / 2;

    // Choose a zoom level that makes the expanded card fit comfortably inside the host
    // (both horizontally and vertically), with 40px margin.
    const fitK = Math.min(
      (hostRect.width  - 40) / EXP_W,
      (hostRect.height - 40) / EXP_H,
      1.0
    );
    const targetK = Math.max(0.45, fitK);

    // Translate so the card center lands at the host center.
    setView({
      k: targetK,
      x: hostRect.width  / 2 - cardCenterX * targetK,
      y: hostRect.height / 2 - cardCenterY * targetK,
    });
  };

  const collapseSubtopic = () => setExpanded(null);

  const visibleAtomsFor = (sid) => atomsState.filter(a => a.subtopicId === sid).filter(a => {
    if (filters.hideHuman && a.kind === 'human') return false;
    if (filters.hideLit && a.kind === 'lit') return false;
    if (filters.hideAi && a.kind === 'ai') return false;
    return true;
  });

  const onAtomMouseDown = (e, a) => {
    e.stopPropagation();
    setAtomDrag({ id: a.id, sx: e.clientX, sy: e.clientY, ox: a.x, oy: a.y });
  };

  // Adding an atom to a subtopic (called from atomize confirm — wired through prop)
  const addAtomToSubtopic = useCallback((sid, atomData) => {
    const id = 'a-new-' + Date.now();
    const sub = subById[sid];
    if (!sub) return;
    // find a non-overlapping position inside the subtopic card
    const existing = atomsState.filter(a => a.subtopicId === sid);
    const x = 280 + (existing.length % 3) * 250 + Math.random() * 30;
    const y = 220 + Math.floor(existing.length / 3) * 200 + Math.random() * 20;
    const newAtom = {
      id, kind: atomData.kind || 'human', authorId: atomData.authorId || 'u-you',
      text: atomData.text, subtopicId: sid,
      x, y, rot: (Math.random() - 0.5) * 4, w: 240,
    };
    setAtomsState(prev => [...prev, newAtom]);
    setPulse(p => [...p, id]);
    setTimeout(() => setPulse(p => p.filter(x => x !== id)), 2000);
  }, [atomsState, subById]);

  window.__addAtomToSubtopic = addAtomToSubtopic; // expose for atomize modal

  const addReaction = useCallback((kind, atom) => {
    setReactions(rs => [...rs, { from: 'a-new-' + Date.now(), to: atom.id, kind, count: 1, fresh: true }]);
  }, []);

  const acceptCluster = (cs) => {
    setCrystallized(c => ({ ...c, [cs.id]: true }));
    // promote floaters to a new subtopic visually — for demo, just hide them and show a new "card"
  };

  // Compute layout for each topic's subtopic cards
  // We arrange cards inside the topic rectangle in a grid.
  const subtopicLayouts = useMemo(() => {
    const layouts = {};
    topics.forEach(t => {
      const subs = t.subtopicIds.map(id => subById[id]).filter(Boolean);
      const cardW = 260, cardH = 200;
      const gap = 28;
      const padTop = 80, padX = 28;
      subs.forEach((s, i) => {
        layouts[s.id] = {
          x: t.x + padX + (i % 2) * (cardW + gap),
          y: t.y + padTop + Math.floor(i / 2) * (cardH + gap),
          w: cardW, h: cardH,
        };
      });
    });
    return layouts;
  }, [topics, subById]);

  // Position floaters within topics
  const floaterLayouts = useMemo(() => {
    const layouts = {};
    floatersState.forEach(f => {
      if (f.interTopic) {
        layouts[f.id] = { x: f.x, y: f.y };
      } else if (f.topicId) {
        const t = topicById[f.topicId];
        if (!t) return;
        // place in topic but avoid subtopic card area
        layouts[f.id] = {
          x: t.x + 30 + f.driftX * (t.w - 280),
          y: t.y + 40 + f.driftY * (t.h - 100),
        };
      }
    });
    return layouts;
  }, [floatersState, topicById]);

  // Bridges between subtopics
  const bridgeCenters = useMemo(() => {
    return bridges.map(b => {
      const la = subtopicLayouts[b.from];
      const lb = subtopicLayouts[b.to];
      if (!la || !lb) return null;
      return {
        ...b,
        ax: la.x + la.w / 2,
        ay: la.y + la.h / 2,
        bx: lb.x + lb.w / 2,
        by: lb.y + lb.h / 2,
      };
    }).filter(Boolean);
  }, [bridges, subtopicLayouts]);

  // expanded card dimensions
  const EXP_W = 1150, EXP_H = 760;

  return (
    <div className="paper-bg" style={{ position: 'absolute', inset: 0, overflow: 'hidden' }}>
      {/* Domain header bar */}
      <div style={{
        position: 'absolute', top: 56, left: 0, right: 0, height: 56,
        display: 'flex', alignItems: 'center', padding: '0 24px', gap: 18,
        zIndex: 30, background: 'rgba(250,248,244,0.92)',
        backdropFilter: 'blur(10px)', borderBottom: '1px solid var(--line)',
      }}>
        <div>
          <div className="mono tiny muted" style={{ letterSpacing: '0.16em', textTransform: 'uppercase' }}>Domain</div>
          <div className="serif" style={{ fontSize: 19, fontWeight: 500, lineHeight: 1.1, letterSpacing: '-0.01em' }}>{domain.title}</div>
        </div>
        <div className="row gap-3 tiny muted" style={{ marginLeft: 14 }}>
          <span>{topics.length} topics</span><span>·</span>
          <span>{subtopics.length} subtopics</span><span>·</span>
          <span>{atomsState.length + floatersState.length} atoms</span>
        </div>
        <div style={{ marginLeft: 'auto' }} className="row gap-2">
          <button className="btn btn-ghost btn-sm" onClick={fitToScreen}><Icon name="compass" size={12}/> Fit</button>
          <button className="btn btn-ghost btn-sm"><Icon name="filter" size={12}/> Filter</button>
        </div>
      </div>

      {/* Pan/zoom canvas */}
      <div
        ref={hostRef}
        className={`canvas-host ${drag ? 'grabbing' : ''} ${atomDrag ? 'grabbing' : ''}`}
        style={{ top: 112, right: aiRailOpen ? 340 : 48, transition: 'right 220ms' }}
        onMouseDown={onMouseDown}
        onMouseMove={onMouseMove}
        onMouseUp={onMouseUp}
        onMouseLeave={onMouseUp}
        onWheel={onWheel}
      >
        <div className="canvas-stage" style={{
          transform: `translate(${view.x}px, ${view.y}px) scale(${view.k})`,
          width: 3200, height: 1600,
        }}>
          {/* Bridge lines between subtopics */}
          <svg style={{ position: 'absolute', inset: 0, width: '100%', height: '100%', pointerEvents: 'none', zIndex: 0 }}>
            {bridgeCenters.map((b, i) => {
              const mx = (b.ax + b.bx) / 2;
              const my = (b.ay + b.by) / 2 - 40;
              return (
                <path
                  key={i}
                  d={`M ${b.ax} ${b.ay} Q ${mx} ${my} ${b.bx} ${b.by}`}
                  className="edge-weak"
                />
              );
            })}
          </svg>

          {/* Topic regions */}
          {topics.map(t => (
            <TopicRegion key={t.id} t={t} dimmed={!!expanded} />
          ))}

          {/* Subtopic accordion cards */}
          {subtopics.map(s => {
            const lay = subtopicLayouts[s.id];
            if (!lay) return null;
            const isExpanded = expanded === s.id;
            const isOtherExpanded = expanded && !isExpanded;
            return (
              <SubtopicCard
                key={s.id}
                s={s}
                topic={topicById[s.topicId]}
                users={users}
                layout={lay}
                expandedSize={{ w: EXP_W, h: EXP_H }}
                expanded={isExpanded}
                dimmed={isOtherExpanded}
                atoms={isExpanded ? visibleAtomsFor(s.id) : []}
                reactions={reactionsState}
                filters={filters}
                onClick={() => !isExpanded && expandSubtopic(s)}
                onCollapse={collapseSubtopic}
                onAtomMouseDown={onAtomMouseDown}
                onAtomClick={(a) => setHighlight(prev => prev === a.id ? null : a.id)}
                onAtomReact={addReaction}
                highlight={highlight}
                pulse={pulse}
                onOpenProposal={onOpenProposal}
                onOpenAtomization={onOpenAtomization}
              />
            );
          })}

          {/* Floater atoms drifting in negative space */}
          {!expanded && floatersState.map(f => {
            const lay = floaterLayouts[f.id];
            if (!lay) return null;
            // hide floaters that are in a crystallized cluster
            const inCluster = clusterSuggestions.find(cs => cs.atomIds.includes(f.id));
            if (inCluster && crystallized[inCluster.id]) return null;
            return <FloaterAtom key={f.id} f={f} pos={lay} users={users} />;
          })}

          {/* Cluster crystallization suggestion */}
          {!expanded && clusterSuggestions.map(cs => {
            if (crystallized[cs.id]) {
              // render as new (provisional) subtopic
              const t = topicById[cs.topicId];
              if (!t) return null;
              // place in lower-right of topic
              return (
                <div key={cs.id} style={{
                  position: 'absolute',
                  left: t.x + t.w - 290, top: t.y + t.h - 220,
                  width: 270, height: 200,
                  background: 'var(--bg-elev)',
                  border: '2px solid var(--amber)', borderRadius: 16,
                  boxShadow: 'var(--sh-3)', padding: 18,
                }}>
                  <div className="mono tiny" style={{ color: 'var(--amber-ink)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>New subtopic · just now</div>
                  <div className="serif" style={{ fontSize: 18, fontWeight: 500, marginTop: 6 }}>{cs.proposedTitle}</div>
                  <div className="tiny muted" style={{ marginTop: 6, lineHeight: 1.4 }}>Crystallized from 3 floating atoms</div>
                  <div className="row gap-2" style={{ marginTop: 10 }}>
                    {['rose','amber','citron'].map(c => (
                      <span key={c} style={{ width: 8, height: 8, borderRadius: '50%', background: `var(--u-${c})` }}/>
                    ))}
                  </div>
                </div>
              );
            }
            // Find center of the floater cluster
            const positions = cs.atomIds.map(id => floaterLayouts[id]).filter(Boolean);
            if (positions.length < 2) return null;
            const cx = positions.reduce((s, p) => s + p.x, 0) / positions.length;
            const cy = positions.reduce((s, p) => s + p.y, 0) / positions.length;
            return (
              <ClusterSuggestion key={cs.id}
                cs={cs}
                positions={positions}
                center={{ x: cx, y: cy }}
                onAccept={() => acceptCluster(cs)}
              />
            );
          })}
        </div>

        {/* Bottom-dock input */}
        <div className="input-dock canvas-control" style={{ left: '50%', transform: 'translateX(-50%)', maxWidth: 760 }}>
          <button className="icon-btn" title="Voice"><Icon name="mic" size={16}/></button>
          <input
            placeholder={expanded
              ? `Add to "${subById[expanded].title}"…`
              : `Add to ${domain.title}… (gets atomized & routed)`}
            onKeyDown={(e) => {
              if (e.key === 'Enter' && e.currentTarget.value.trim()) {
                onOpenAtomization(e.currentTarget.value, expanded);
                e.currentTarget.value = '';
              }
            }}
          />
          <button className="btn btn-ghost btn-sm"><Icon name="wand" size={13}/> AI assist</button>
          <button className="btn btn-primary btn-sm" onClick={() => onOpenAtomization('', expanded)}>
            <Icon name="send" size={12}/> Atomize
          </button>
        </div>

        {/* Zoom controls */}
        <div className="zoom-ctl">
          <button onClick={() => zoomBtn(0.15)}><Icon name="plus" size={13}/></button>
          <div className="div"/>
          <button onClick={() => zoomBtn(-0.15)}><Icon name="minus" size={13}/></button>
        </div>

        {/* Collapse-back hint when expanded */}
        {expanded && (
          <button
            className="canvas-control btn btn-ghost btn-sm"
            style={{ position: 'absolute', top: 16, left: 16, zIndex: 30, background: 'rgba(255,255,255,0.92)' }}
            onClick={collapseSubtopic}
          >
            <Icon name="arrow-left" size={12}/> Back to map
          </button>
        )}
      </div>

      {/* Right-edge AI Summary rail */}
      <AiSummaryRail
        open={aiRailOpen}
        onToggle={() => setAiRailOpen(v => !v)}
        domain={domain}
        expanded={expanded ? subById[expanded] : null}
        summary={summary}
        insights={insights}
        clusterSuggestions={clusterSuggestions.filter(cs => !crystallized[cs.id])}
        onAcceptCluster={acceptCluster}
        onOpenInsight={onOpenInsight}
        onRefClick={(atomId) => {
          setHighlight(atomId);
          setTimeout(() => setHighlight(null), 1700);
        }}
        onOpenProposal={onOpenProposal}
      />
    </div>
  );
}

// ===== Subtopic card (collapsed = preview, expanded = full detail) =====

        border: '1px solid var(--line)',

        borderBottom: expanded ? '1px solid var(--line)' : 'none',

      }}>
        <div className="row gap-2" style={{ marginBottom: 4, alignItems: 'center' }}>
          <span className="mono tiny" style={{ letterSpacing: '0.14em', textTransform: 'uppercase', color: 'var(--ink-4)' }}>Subtopic</span>
          {s.hot && !expanded && (
            <span className="chip" style={{ background: 'var(--amber-soft)', borderColor: 'transparent', color: 'var(--amber-ink)', fontSize: 10, padding: '2px 6px' }}>
              <Icon name="sparkle" size={9}/> active
            </span>

            <Maturity value={s.maturity} />

          {expanded && (
            <button className="icon-btn" onClick={(e) => { e.stopPropagation(); onCollapse(); }} title="Collapse">

            <span className="row gap-1">

            <span className="row gap-1">
              <span style={{ width: 6, height: 6, background: 'var(--ink-2)' }}/>

              {s.maturity > 0.8 && (

                  users={users}
                  selected={highlight === a.id}

                />
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ===== Floater atom (small, drifting in negative space) =====
function FloaterAtom({ f, pos, users }) {
  const author = users.find(u => u.id === f.authorId);
  const [hover, setHover] = useState(false);
  const isLit = f.kind === 'lit';
  return (
    <div
      style={{
        position: 'absolute', left: pos.x, top: pos.y,
        width: 200,
        background: isLit ? '#2A2724' : 'rgba(255,253,247,0.85)',
        color: isLit ? '#E8E2D0' : 'var(--ink-2)',
        border: isLit ? 'none' : '1px dashed rgba(120,100,70,0.4)',
        borderRadius: isLit ? 6 : 12,
        padding: '10px 12px',
        fontFamily: isLit ? 'var(--f-mono)' : 'var(--f-hand)',
        fontSize: isLit ? 11 : 12,
        lineHeight: 1.4,
        opacity: hover ? 1 : 0.8,
        transform: `rotate(${(f.id.charCodeAt(2) % 7) - 3}deg)`,
        boxShadow: hover ? 'var(--sh-2)' : 'none',
        cursor: 'default',
        zIndex: 4,
        pointerEvents: 'auto',
      }}
      onMouseEnter={() => setHover(true)}
      onMouseLeave={() => setHover(false)}
    >
      {f.text}
      {author && !isLit && (
        <div className="row gap-2" style={{ marginTop: 6, fontFamily: 'var(--f-sans)', fontSize: 9, color: 'var(--ink-4)' }}>
          <span style={{ width: 6, height: 6, borderRadius: '50%', background: author.colorVar || 'var(--ink-4)' }}/>
          <span>{author.name}</span>
          <span style={{ marginLeft: 'auto', fontStyle: 'italic' }}>floating</span>
        </div>
      )}
      {isLit && (
        <div style={{ marginTop: 5, fontSize: 9, opacity: 0.7 }}>{f.cite}</div>
      )}
    </div>
  );
}

// ===== Cluster crystallization suggestion (drawn around 3+ floaters) =====
function ClusterSuggestion({ cs, positions, center, onAccept }) {
  const minX = Math.min(...positions.map(p => p.x));
  const minY = Math.min(...positions.map(p => p.y));
  const maxX = Math.max(...positions.map(p => p.x + 200));
  const maxY = Math.max(...positions.map(p => p.y + 70));
  const padding = 20;
  return (
    <>
      {/* Halo around floaters */}
      <div style={{
        position: 'absolute',
        left: minX - padding, top: minY - padding,
        width: maxX - minX + padding * 2,
        height: maxY - minY + padding * 2,
        border: '1.5px dashed var(--amber)',
        borderRadius: 20,
        background: 'rgba(220,180,80,0.05)',
        pointerEvents: 'none',
        zIndex: 3,
      }}/>
      {/* Suggestion bubble */}
      <div style={{
        position: 'absolute',
        left: maxX + padding + 10, top: minY - padding,
        width: 240,
        background: 'var(--bg-elev)',
        border: '1.5px solid var(--amber)',
        borderRadius: 14,
        padding: 14,
        boxShadow: 'var(--sh-2)',
        zIndex: 6,
      }}>
        <div className="mono tiny" style={{ color: 'var(--amber-ink)', letterSpacing: '0.14em', textTransform: 'uppercase' }}>
          <Icon name="sparkle" size={10}/> Crystallizing
        </div>
        <div className="serif" style={{ fontSize: 16, fontWeight: 500, marginTop: 4 }}>{cs.proposedTitle}</div>
        <div className="tiny muted" style={{ marginTop: 6, lineHeight: 1.4 }}>{cs.reason}</div>
        <div className="row gap-2" style={{ marginTop: 12 }}>
          <button className="btn btn-amber btn-sm" onClick={onAccept}>Crystallize</button>
          <button className="btn btn-ghost btn-sm">Not yet</button>
        </div>
      </div>
    </>
  );
}

// ===== screen-atomize.jsx =====
var { useState, useEffect, useRef, useMemo, useCallback, Fragment } = React;
// ===== Screen D — Atomization Preview =====

function AtomizationPreview({ open, originalText, you, onClose, onConfirm }) {
  const [proposals, setProposals] = useState([]);
  const [origText, setOrigText] = useState('');

  useEffect(() => {
    if (!open) return;
    const text = originalText || "I think AI tutoring should consider learners' metacognition — especially when decomposing complex problems. Also, scaffolding has strong literature support — Wood et al. is the classic.";
    setOrigText(text);
    setProposals([
      {
        id: 'p1', text: "AI tutoring should consider metacognition.",
        target: 'Metacognition Support', confidence: 0.86, status: 'pending',
        sourceSpan: [0, 56],
      },
      {
        id: 'p2', text: "Scaffolding for complex problem decomposition matters.",
        target: 'Adaptive Scaffolding', confidence: 0.81, status: 'pending',
        sourceSpan: [60, 130],
      },
      {
        id: 'p3', text: "Wood et al. provides foundational support for scaffolding.",
        target: 'Adaptive Scaffolding', confidence: 0.74, status: 'pending', autoCite: true,
        sourceSpan: [134, 200],
      },
    ]);
  }, [open, originalText]);

  if (!open) return null;

  const setStatus = (id, status) => setProposals(ps => ps.map(p => p.id === id ? { ...p, status } : p));
  const updateText = (id, text) => setProposals(ps => ps.map(p => p.id === id ? { ...p, text } : p));
  const updateTarget = (id, target) => setProposals(ps => ps.map(p => p.id === id ? { ...p, target } : p));

  const acceptAll = () => setProposals(ps => ps.map(p => ({ ...p, status: 'accepted' })));
  const mergeAll = () => {
    setProposals(ps => [{
      id: 'merged',
      text: ps.map(p => p.text).join(' / '),
      target: 'Adaptive Scaffolding',
      confidence: 0.62,
      status: 'accepted',
      merged: true,
    }]);
  };

  const accepted = proposals.filter(p => p.status !== 'rejected');
  const allReady = proposals.every(p => p.status !== 'pending');

  return (
    <div className="modal-back" onMouseDown={onClose}>
      <div className="modal" onMouseDown={(e) => e.stopPropagation()} style={{ padding: 0, maxWidth: 760 }}>
        <div style={{ padding: '24px 28px 18px', borderBottom: '1px solid var(--line)' }}>
          <div className="row" style={{ marginBottom: 10 }}>
            <span className="mono tiny muted" style={{ letterSpacing: '0.14em', textTransform: 'uppercase' }}>Atomization preview</span>
            <button className="icon-btn" style={{ marginLeft: 'auto' }} onClick={onClose}><Icon name="x" size={14}/></button>
          </div>
          <h2 className="serif" style={{ margin: 0, fontSize: 24, fontWeight: 500, letterSpacing: '-0.01em' }}>
            Review how your contribution gets split
          </h2>
          <p className="muted" style={{ fontSize: 13, marginTop: 6 }}>
            You can accept, edit, merge, re-route, or reject any atom. Nothing enters the canvas until you confirm.
          </p>
        </div>

        {/* Original input */}
        <div style={{ padding: '18px 28px', background: 'var(--bg-tint)', borderBottom: '1px solid var(--line)' }}>
          <div className="row gap-2" style={{ marginBottom: 8 }}>
            <Avatar user={you} size={20}/>
            <span className="tiny muted">You said</span>
          </div>
          <p className="hand" style={{ margin: 0, fontSize: 19, lineHeight: 1.35, color: 'var(--ink)' }}>
            "{origText}"
          </p>
        </div>

        {/* Proposed atoms */}
        <div style={{ padding: '18px 28px' }}>
          <div className="row" style={{ marginBottom: 14 }}>
            <span className="mono tiny muted">AI proposed {proposals.length} atom{proposals.length !== 1 ? 's' : ''}</span>
            <span style={{ marginLeft: 'auto' }} className="row gap-2">
              <button className="btn btn-ghost btn-sm" onClick={mergeAll}><Icon name="merge" size={12}/> Merge all into one</button>
              <button className="btn btn-sm" onClick={acceptAll}><Icon name="check" size={12}/> Accept all</button>
            </span>
          </div>

          <div className="col gap-3">
            {proposals.map((p, idx) => (
              <ProposalRow key={p.id}
                p={p}
                index={idx + 1}
                you={you}
                onAccept={() => setStatus(p.id, 'accepted')}
                onReject={() => setStatus(p.id, 'rejected')}
                onText={(t) => updateText(p.id, t)}
                onTarget={(t) => updateTarget(p.id, t)}
              />
            ))}
          </div>
        </div>

        <div style={{ padding: '14px 28px', borderTop: '1px solid var(--line)', display: 'flex', alignItems: 'center', gap: 12 }}>
          <span className="tiny muted">
            {accepted.length} of {proposals.length} will join the canvas. Rejected items stay private.
          </span>
          <span style={{ marginLeft: 'auto' }} className="row gap-2">
            <button className="btn btn-ghost" onClick={onClose}>Cancel</button>
            <button className="btn btn-primary" onClick={() => onConfirm(accepted)}>
              <Icon name="send" size={12}/> Add {accepted.length} atom{accepted.length !== 1 ? 's' : ''}
            </button>
          </span>
        </div>
      </div>
    </div>
  );
}

function ProposalRow({ p, index, you, onAccept, onReject, onText, onTarget }) {
  const [editing, setEditing] = useState(false);
  const [text, setText] = useState(p.text);
  const targets = ['Adaptive Scaffolding', 'Metacognition Support', 'Dialogic Tutoring', 'Self-regulation', '+ New subtopic'];
  const isRejected = p.status === 'rejected';
  const isAccepted = p.status === 'accepted';

  return (
    <div style={{
      border: '1px solid var(--line)',
      borderRadius: 12,
      padding: 14,
      background: isRejected ? 'var(--bg-tint)' : 'var(--bg-elev)',
      opacity: isRejected ? 0.5 : 1,
      transition: 'all 200ms',
    }}>
      <div className="row gap-3">
        <div style={{ minWidth: 32 }}>
          <span className="mono tiny muted" style={{ fontSize: 10, letterSpacing: '0.1em' }}>ATOM</span>
          <div className="serif" style={{ fontSize: 18, fontWeight: 500, lineHeight: 1 }}>{String(index).padStart(2,'0')}</div>
        </div>
        <div style={{ flex: 1 }}>
          {/* Sticky preview of the atom */}
          <div style={{ display: 'inline-block', maxWidth: 460 }}>
            <div className="atom-human" style={{
              position: 'relative',
              background: you.bg,
              transform: `rotate(${(index % 2 ? -1 : 1) * 0.8}deg)`,
              fontSize: 17,
              padding: editing ? '8px 10px 10px' : undefined,
            }}>
              {editing ? (
                <textarea
                  value={text}
                  onChange={e => setText(e.target.value)}
                  onBlur={() => { setEditing(false); onText(text); }}
                  autoFocus
                  style={{
                    width: '100%', minHeight: 50,
                    border: 'none', background: 'transparent', resize: 'vertical',
                    fontFamily: 'var(--f-hand)', fontSize: 17, lineHeight: 1.2, outline: 'none',
                  }}
                />
              ) : (
                <span>{p.text}</span>
              )}
              <div className="meta">
                <span className="dot" style={{ color: you.colorVar }}/>
                <span>You</span>
                <span style={{ marginLeft: 'auto' }} className="mono tiny">conf {Math.round(p.confidence*100)}%</span>
              </div>
            </div>
          </div>

          {/* Routing */}
          <div className="row gap-2" style={{ marginTop: 10, flexWrap: 'wrap' }}>
            <span className="tiny muted">Routes to</span>
            <select
              value={p.target}
              onChange={e => onTarget(e.target.value)}
              style={{
                border: '1px solid var(--line)', background: 'var(--bg-elev)',
                borderRadius: 6, padding: '3px 8px', fontFamily: 'var(--f-sans)', fontSize: 12,
              }}
            >
              {targets.map(t => <option key={t}>{t}</option>)}
            </select>
            {p.autoCite && (
              <span className="chip" style={{ background: 'color-mix(in oklch, var(--cite) 14%, white)', color: 'var(--cite)', borderColor: 'transparent' }}>
                <Icon name="sparkle" size={10}/> Auto Cite detected
              </span>
            )}
            {isAccepted && (
              <span className="chip" style={{ background: 'color-mix(in oklch, var(--support) 16%, white)', color: 'var(--support)', borderColor: 'transparent' }}>
                <Icon name="check" size={10}/> Accepted
              </span>
            )}
          </div>
        </div>

        {/* Actions */}
        <div className="col gap-2" style={{ alignSelf: 'flex-start' }}>
          <button className="btn btn-sm" onClick={onAccept}><Icon name="check" size={12}/></button>
          <button className="btn btn-sm" onClick={() => setEditing(!editing)}><Icon name="edit" size={12}/></button>
          <button className="btn btn-sm" onClick={onReject}><Icon name="x" size={12}/></button>
        </div>
      </div>
    </div>
  );
}

window.AtomizationPreview = AtomizationPreview;

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <div className="twk-root">
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-noncommentable=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </div>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <div className="twk-section-root">
      <div className="twk-sect">{label}</div>
      {children}
    </div>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

  </script>
  <script type="text/babel" data-presets="react">
// ===== app.jsx =====
var { useState, useEffect, useRef, useMemo, useCallback, Fragment } = React;

// ===== App — orchestrates screens and global state =====

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showColors": true,
  "atomDensity": "medium",
  "aiVisibility": "all",
  "showHalos": true,
  "showHumanFont": true
}/*EDITMODE-END*/;

function App() {
  const D = window.AppData;

  const [level, setLevel] = useState('lobby'); // lobby | domain
  const [domain, setDomain] = useState(D.domains[0]);
  const [onboardOpen, setOnboardOpen] = useState(true);

  // modals
  const [atomizeOpen, setAtomizeOpen] = useState(false);
  const [atomizeText, setAtomizeText] = useState('');
  const [dashOpen, setDashOpen] = useState(false);
  const [proposalOpen, setProposalOpen] = useState(false);
  const [collabOpen, setCollabOpen] = useState(false);
  const [insightOpen, setInsightOpen] = useState(null);

  // canvas filters
  const [filters, setFilters] = useState({
    hideHuman: false, hideLit: false, hideAi: false,
    hideColors: false,
    hideEdges: { support: false, challenge: false, refine: false, question: false, cite: false },
  });
  const onFilterChange = (key, val) => setFilters(f => ({ ...f, [key]: val }));

  const you = D.users.find(u => u.isYou);

  // tweaks
  const [tweaks, setTweak] = window.useTweaks ? window.useTweaks(TWEAK_DEFAULTS) : [TWEAK_DEFAULTS, () => {}];

  // Apply tweaks to filters where applicable
  useEffect(() => {
    setFilters(f => ({
      ...f,
      hideColors: !tweaks.showColors,
      hideAi: tweaks.aiVisibility === 'hide',
    }));
  }, [tweaks.showColors, tweaks.aiVisibility]);

  // Breadcrumb
  const breadcrumbs = useMemo(() => {
    const out = [{ id: 'lobby', label: 'Lobby' }];
    if (level === 'domain') out.push({ id: domain.id, label: domain.title });
    return out;
  }, [level, domain]);

  const goLobby = () => setLevel('lobby');
  const goDomain = (d) => { if (d) setDomain(d); setLevel('domain'); };

  const onCrumbClick = (c, i) => {
    if (i === 0) goLobby();
  };

  return (
    <div>
      <Onboarding open={onboardOpen} onClose={() => setOnboardOpen(false)} />

      <TopNav
        level={level}
        breadcrumbs={breadcrumbs}
        onCrumbClick={onCrumbClick}
        you={you}
        notify
        onOpenDashboard={() => setDashOpen(true)}
        onOpenCollab={() => setCollabOpen(true)}
        onOpenProposal={() => setProposalOpen(true)}
      />

      {level === 'lobby' && (
        <DomainLobby
          domains={D.domains}
          you={you}
          onPickDomain={(d) => goDomain(d)}
        />
      )}

      {level === 'domain' && (
        <DomainCanvas
          domain={domain}
          topics={D.topics}
          subtopics={D.subtopics}
          atoms={D.atoms}
          reactions={D.reactions}
          users={D.users}
          summary={D.summary}
          insights={D.insights}
          bridges={D.bridges}
          floaters={D.floaters}
          clusterSuggestions={D.clusterSuggestions}
          filters={filters}
          onFilterChange={onFilterChange}
          onOpenAtomization={(t) => { setAtomizeText(t || ''); setAtomizeOpen(true); }}
          onOpenProposal={() => setProposalOpen(true)}
          onOpenInsight={(ins) => setInsightOpen(ins)}
          tweaks={tweaks}
        />
      )}

      <AtomizationPreview
        open={atomizeOpen}
        you={you}
        originalText={atomizeText}
        onClose={() => setAtomizeOpen(false)}
        onConfirm={() => { setAtomizeOpen(false); }}
      />

      <Dashboard open={dashOpen} you={you} dashboard={D.dashboard} users={D.users} onClose={() => setDashOpen(false)} />
      <Proposal open={proposalOpen} proposal={D.proposal} onClose={() => setProposalOpen(false)} />
      <Collaborators open={collabOpen} users={D.users} you={you} onClose={() => setCollabOpen(false)} />
      <InsightModal insight={insightOpen} atoms={D.atoms} users={D.users} onClose={() => setInsightOpen(null)} />

      {/* Tweaks panel */}
      {window.TweaksPanel && (
        <window.TweaksPanel title="Tweaks">
          <window.TweakSection label="Display">
            <window.TweakToggle label="Color-code by user" value={tweaks.showColors} onChange={(v) => setTweak('showColors', v)} />
            <window.TweakToggle label="Show cluster halos" value={tweaks.showHalos} onChange={(v) => setTweak('showHalos', v)} />
            <window.TweakToggle label="Handwritten font for human atoms" value={tweaks.showHumanFont} onChange={(v) => setTweak('showHumanFont', v)} />
          </window.TweakSection>
          <window.TweakSection label="AI atoms">
            <window.TweakRadio
              label="Visibility"
              value={tweaks.aiVisibility}
              options={[{ value: 'all', label: 'All' }, { value: 'connect', label: 'Only connectors' }, { value: 'hide', label: 'Hide' }]}
              onChange={(v) => setTweak('aiVisibility', v)}
            />
          </window.TweakSection>
          <window.TweakSection label="Density">
            <window.TweakRadio
              label="Cluster"
              value={tweaks.atomDensity}
              options={[{ value: 'loose', label: 'Loose' }, { value: 'medium', label: 'Medium' }, { value: 'tight', label: 'Tight' }]}
              onChange={(v) => setTweak('atomDensity', v)}
            />
          </window.TweakSection>
          <window.TweakSection label="Quick navigation">
            <window.TweakButton label="Open onboarding again" onClick={() => setOnboardOpen(true)} />
            <window.TweakButton label="Show atomization preview" onClick={() => { setAtomizeOpen(true); }} />
            <window.TweakButton label="Show proposal generator" onClick={() => setProposalOpen(true)} />
            <window.TweakButton label="Show personal dashboard" onClick={() => setDashOpen(true)} />
            <window.TweakButton label="Show collaborator finder" onClick={() => setCollabOpen(true)} />
          </window.TweakSection>
        </window.TweaksPanel>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
